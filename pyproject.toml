[project]
name = "aiplatform"
version = "0.1.0"
description = "AI Medical Document Processing Platform — extract, transform, stage, and promote clinical data to FHIR"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # ── Core ──
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "pyyaml>=6.0",

    # ── LLM / HTTP ──
    "openai>=2.0",
    "httpx>=0.27",

    # ── Document extraction ──
    "pymupdf>=1.24",
    "pydicom>=3.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "psycopg2-binary>=2.9",

    # ── Data / SQL ──
    "sqlalchemy>=2.0",
    "redis>=5.0",
    "boto3>=1.34",

    # ── Graph databases ──
    "python-arango>=8.0",
    "neo4j>=5.0",

    # ── Search / vector indexing ──
    "opensearch-py>=2.0",

    # ── FHIR ──
    "fhir.resources>=8.0",

    # ── FileNest internal SDK (local path, not on PyPI) ──
    "filenest-python-sdk",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
filenest-python-sdk = { path = "/home/kipla/filenest-python-sdk" }
