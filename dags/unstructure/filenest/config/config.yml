# FileNest Asset Pipeline Configuration
# DAGs: dags/unstructure/filenest/asset_producer.py, asset_consumer.py

pipeline:
  description: "FileNest → Download → PostgreSQL → Asset → Extract → Classify → Transform → Clinical Domain Model"
  schedule: "@daily"
  retries: 1
  retry_delay_minutes: 5

credentials:
  mode: "airflow"                    # "airflow" = Airflow Connections, "local" = .env
  filenest_conn_id: "filenest_conn_id"
  postgres_conn_id: "postgres_conn_id"

project_root: "/home/kipla/aipipeline/aiplatform"

filenest:
  download_dir: "storage/temp"
  supported_extensions: [".pdf", ".dcm", ".png", ".jpg", ".jpeg", ".webp", ".tiff", ".bmp"]

asset:
  name: "medical_files_asset"
  uri: "file:///medical/files/available"
  group: "filenest"

download:
  download_dir: "/home/kipla/aipipeline/aiplatform/storage/temp"

extraction:
  extract_images: true
  image_output_dir: "/home/kipla/aipipeline/aiplatform/storage/images"

classification:
  model: "gpt-4o-mini"
  prompt_file: "prompts/report_classification.md"

transformation:
  model: "gpt-4o-mini"
  prompt_file: "prompts/clinical_extraction.md"
  output_dir: "/home/kipla/aipipeline/aiplatform/storage/emr/transformed"

fhir_staging:
  base_url: "http://localhost:8002"
  enabled: true

openai:
  connection_id: "openai"
  timeout: 120
  max_retries: 3
  # Airflow connection id
