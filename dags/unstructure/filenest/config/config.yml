# FileNest Asset Pipeline Configuration
# DAGs: dags/unstructure/filenest/asset_producer.py, asset_consumer.py

pipeline:
  description: "FHIR-Staging → Asset → FileNest Download → Extract → Classify → Transform → FHIR-Staging"
  retries: 1
  retry_delay_minutes: 5

credentials:
  mode: "airflow"                    # "airflow" = Airflow Connections, "local" = .env
  filenest_conn_id: "filenest_conn_id"
  openai_conn_id: "openai"
  fhir_staging_conn_id: "fhir-staging"

project_root: "aiplatform"

filenest:
  download_dir: "aiplatform/storage/temp"
  supported_extensions:
    - ".pdf"
    - ".dcm"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".webp"
    - ".tiff"
    - ".bmp"

asset:
  name: "medical_files_asset"
  uri: "file:///medical/files/available"
  group: "filenest"

download:
  download_dir: "storage/temp"

extraction:
  extract_images: true
  image_output_dir: "storage/images"

classification:
  model: "gpt-4o-mini"
  prompt_file: "aiplatform/src/components/prompts/report_classification.md"

transformation:
  model: "gpt-4o-mini"
  prompt_file: "aiplatform/src/components/prompts/clinical_extraction.md"
  output_dir: "aiplatform/storage/emr/transformed"

fhir_staging:
  base_url: "http://localhost:8002"
  enabled: false  # set true only when the fhir-staging service is actually running

openai:
  connection_id: "openai"
  timeout: 120
  max_retries: 3