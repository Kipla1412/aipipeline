# EMR Transformer Pipeline Configuration
# DAG: dags/unstructure/emr/emr.py

pipeline:
  description: "NAS → Extract → LLM Classify → LLM Transform → Clinical Domain Model"
  schedule: "@daily"
  retries: 1
  retry_delay_minutes: 5

nas:
  directory: "/home/kipla/aipipeline/aiplatform/storage/raw"
  allowed_extensions: [".pdf", ".dcm"]
  stability_delay_seconds: 1.0
  stability_retries: 5

extraction:
  extract_images: true
  image_output_dir: "/home/kipla/aipipeline/aiplatform/storage/images"

classification:
  model: "gpt-4o-mini"
  prompt_file: "prompts/report_classification.md"

transformation:
  model: "gpt-4o-mini"
  prompt_file: "prompts/clinical_extraction.md"
  output_dir: "/home/kipla/aipipeline/aiplatform/storage/emr/transformed"

openai:
  connection_id: "openai"
  timeout: 120
  max_retries: 3
